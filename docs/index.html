<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Mohammad Taher Ahmadi - Game Engine Developer</title>

<meta name="description" content="Portfolio and web resume of Mohammad Taher Ahmadi, Game Engine Developer and Graphics Programmer specializing in ECS engines, graphics programming, physics systems, and live multiplayer games." />

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/main.css">
</head>

<body>
<div class="bg-symbols" aria-hidden="true"></div>

<div id="content"></div>

<script>
async function loadPartial(url) {
    const response = await fetch(url);
    return await response.text();
}

async function loadAllPartials() {
    const content = document.getElementById('content');
    const partials = [
        'partials/nav.html',
        'partials/hero.html',
        'partials/highlights.html',
        'partials/projects.html',
        'partials/selected-projects.html',
        'partials/experience.html',
        'partials/skills.html',
        'partials/education.html',
        'partials/looking-for.html',
        'partials/footer.html'
    ];

    for (const partial of partials) {
        const html = await loadPartial(partial);
        content.insertAdjacentHTML('beforeend', html);
    }

    // After loading, run the scripts that depend on the DOM
    initBackgroundSymbols();
    initSliders();
}

function initBackgroundSymbols() {
    const symbolLayer = document.querySelector('.bg-symbols');

    const symbols = [
        '☠', '×', '○', '♡', '◉', '△', '◇', '⌬', '⌖', '⊗',
        '⊙', '⬡', '✦', '✧', '⟡', '◌', '◍', '◎', '◈', '◆'
    ];

    const colors = ['', 'yellow', '', '', 'red'];

    const symbolCount = 46;

    for (let i = 0; i < symbolCount; i++) {
        const el = document.createElement('div');
        el.className = `bg-symbol ${colors[Math.floor(Math.random() * colors.length)]}`;

        const inner = document.createElement('span');
        inner.textContent = symbols[Math.floor(Math.random() * symbols.length)];

        el.appendChild(inner);

        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const size = 28 + Math.random() * 34;
        const delay = Math.random() * -12;
        const duration = 8 + Math.random() * 12;

        el.style.left = `${x}%`;
        el.style.top = `${y}%`;
        el.style.width = `${size}px`;
        el.style.height = `${size}px`;
        el.style.fontSize = `${size * 0.42}px`;
        el.style.animationDelay = `${delay}s`;
        el.style.animationDuration = `${duration}s, ${4 + Math.random() * 5}s`;

        symbolLayer.appendChild(el);
    }
}

function initSliders() {
    const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1629654297299-c8506221ca97?auto=format&fit=crop&w=1000&q=80";
    const SLIDE_TIME = 3500;

    const sliders = document.querySelectorAll(".project-slider");

    sliders.forEach((slider, sliderIndex) => {
        const imageList = slider.dataset.images
            .split(",")
            .map(src => src.trim())
            .filter(Boolean);

        const altText = slider.dataset.alt || "Project screenshot";

        if (!imageList.length) return;

        let currentIndex = 0;
        let intervalId;

        const images = [];
        const dots = [];

        imageList.forEach((src, index) => {
            const img = document.createElement("img");

            img.src = src;
            img.alt = `${altText} ${index + 1}`;
            img.loading = "lazy";

            if (index === 0) {
                img.classList.add("active");
            }

            img.onerror = () => {
                img.onerror = null;
                img.src = FALLBACK_IMAGE;
            };

            slider.appendChild(img);
            images.push(img);
        });

        const dotsContainer = document.createElement("div");
        dotsContainer.className = "slider-dots";

        imageList.forEach((_, index) => {
            const dot = document.createElement("button");

            dot.className = "slider-dot";
            dot.type = "button";
            dot.addEventListener("click", () => {
                showSlide(index);
                resetInterval();
            });

            if (index === 0) {
                dot.classList.add("active");
            }

            dotsContainer.appendChild(dot);
            dots.push(dot);
        });

        slider.appendChild(dotsContainer);

        function showSlide(index) {
            images.forEach((img, i) => {
                img.classList.toggle("active", i === index);
            });
            dots.forEach((dot, i) => {
                dot.classList.toggle("active", i === index);
            });
            currentIndex = index;
        }

        function nextSlide() {
            const nextIndex = (currentIndex + 1) % images.length;
            showSlide(nextIndex);
        }

        function resetInterval() {
            clearInterval(intervalId);
            intervalId = setInterval(nextSlide, SLIDE_TIME);
        }

        resetInterval();
    });
}

loadAllPartials();
</script>
</body>
</html>
