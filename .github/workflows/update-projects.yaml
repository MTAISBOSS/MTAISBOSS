name: Update Selected Projects

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:  # Allows manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-projects.yaml'
  # Trigger when a new repository is created (via repository_dispatch)
  repository_dispatch:
    types: [new-repo]

jobs:
  update-projects:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install @octokit/rest fs-extra axios

      - name: Update selected projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: node .github/scripts/update-projects.js

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/partials/selected-projects.html
          git diff --quiet && git diff --staged --quiet || (
            git commit -m "🤖 Auto-update selected projects [skip ci]" &&
            git push
          )